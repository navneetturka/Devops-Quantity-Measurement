spring.application.name=Quantity Measurement App
server.port=8080

# ==================== MySQL Database ====================
spring.datasource.url=jdbc:mysql://localhost:3306/quantitymeasurementdb?useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ==================== JPA / Hibernate ====================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==================== Connection Pool ====================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ==================== H2 Console (disabled in prod) ====================
spring.h2.console.enabled=false

# ==================== Logging ====================
logging.level.root=WARN
logging.level.com.apps.quantitymeasurement=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ==================== Swagger/OpenAPI ====================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==================== Actuator ====================
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=never