spring.application.name=Quantity Measurement App
server.port=8080

# ==================== JPA Configuration ====================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================== H2 Database ====================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:file:./data/quantitymeasurementdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==================== Connection Pool ====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ==================== Logging ====================
logging.level.root=INFO
logging.level.com.apps.quantitymeasurement=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{5}:%line - %msg%n

# ==================== Swagger/OpenAPI ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ==================== Actuator ====================
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true

# ==================== Google OAuth2 Client ====================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ==================== JWT Configuration ====================
app.jwt.secret=${JWT_SECRET:your-random-secret}
app.jwt.expiration=86400000

# ==================== App Frontend Configuration ====================
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ==================== Security Public Paths ====================
app.security.public-paths=/api/auth/login,/oauth2/**,/login/**,/swagger-ui/**,/swagger-ui.html,/api-docs/**,/actuator/health,/h2-console/**,/error,/,/index.html,/*.css,/*.js,/history.html
